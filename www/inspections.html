<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Inspecciones — Herramienta de Evaluación Rápida de Daños en Edificaciones</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body class="bg-slate-50 min-h-screen">
  <nav id="nav" class="bg-white border-b border-slate-200 sticky top-0 z-10"></nav>

  <main class="max-w-6xl mx-auto px-4 py-6 pb-16">
    <div class="flex items-start justify-between gap-3 mb-4">
      <div>
        <h1 class="text-xl sm:text-2xl font-semibold text-slate-800">Inspecciones</h1>
        <p class="text-sm text-slate-500 mt-0.5">Todas las evaluaciones registradas.</p>
      </div>
      <button id="newInspectionBtn" class="btn-primary shrink-0">+ Nueva</button>
    </div>

    <div id="filters" class="flex flex-wrap gap-2 mb-5"></div>

    <div id="list" class="space-y-2"></div>
  </main>

  <footer id="footer"></footer>

  <script src="/native-shim.js"></script>
  <script src="/offline.js"></script>
  <script src="/local-index.js"></script>
  <script src="/app.js"></script>
  <script>
    renderNav("inspections");
    renderFooter();

    const STATUS_FILTERS = [
      { value: "", label: "Todas" },
      { value: "BORRADOR", label: "Borrador" },
      { value: "EN_PROCESO", label: "En proceso" },
      { value: "FINALIZADA", label: "Finalizada" },
      { value: "INFORME_GENERADO", label: "Informe generado" },
    ];
    let currentFilter = "";

    function renderFilters() {
      document.getElementById("filters").innerHTML = STATUS_FILTERS.map(
        (f) => `<button class="filter-btn chip-btn ${currentFilter === f.value ? "border-2 border-brand-600 bg-brand-600 text-white shadow-sm" : "border-2 border-slate-400 bg-white text-slate-800"}" data-value="${f.value}">${f.label}</button>`,
      ).join("");
      document.querySelectorAll(".filter-btn").forEach((btn) =>
        btn.addEventListener("click", () => {
          currentFilter = btn.dataset.value;
          renderFilters();
          load();
        }),
      );
    }

    // Respaldo local ante falla de red real (sin conexión): se guarda la
    // última lista sin filtrar que sí llegó a cargar bien, para poder seguir
    // encontrando/abriendo una inspección ya existente aunque en ese momento
    // no haya señal (solo se cachea la vista "Todas", no cada filtro).
    const INSPECTIONS_LIST_CACHE_KEY = "edificaciones_inspections_list_cache";
    function cacheInspectionsList(inspections) {
      try {
        localStorage.setItem(INSPECTIONS_LIST_CACHE_KEY, JSON.stringify(inspections));
      } catch (err) {
        // localStorage lleno o no disponible: no es crítico, solo se pierde el respaldo offline.
      }
    }
    function readInspectionsListCache() {
      try {
        const raw = localStorage.getItem(INSPECTIONS_LIST_CACHE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (err) {
        return null;
      }
    }

    async function load() {
      const qs = currentFilter ? `?status=${currentFilter}` : "";
      const listEl = document.getElementById("list");
      let inspections;
      let offline = false;
      try {
        ({ inspections } = await api(`/inspections${qs}`));
        if (!currentFilter) cacheInspectionsList(inspections);
      } catch (err) {
        // Respaldo local: el índice liviano (local-index.js) se alimenta de
        // cada inspección guardada/creada en este dispositivo -- a
        // diferencia del respaldo viejo (`readInspectionsListCache`), que
        // solo se poblaba tras un GET exitoso al servidor y por eso se
        // quedaba vacío para siempre en la variante local-first (que nunca
        // llega a tener uno), este sí refleja lo que de verdad hay guardado
        // acá, con soporte de filtro por estado incluido.
        inspections = window.localInspectionsIndex
          ? window.localInspectionsIndex.list({ status: currentFilter || undefined })
          : readInspectionsListCache() || [];
        if (!inspections.length) {
          listEl.innerHTML = `<div class="card p-8 text-center text-sm text-slate-500">Sin conexión y todavía sin datos guardados en este dispositivo${currentFilter ? " con este estado" : ""}. Abre esta lista una vez con señal para poder consultarla después sin conexión, o crea una inspección nueva.</div>`;
          return;
        }
        offline = true;
      }
      const offlineNotice = offline
        ? `<div class="card p-3 mb-2 text-xs text-amber-700 bg-amber-50 border border-amber-200">⚠️ Sin conexión — mostrando la última lista guardada en este dispositivo, puede no estar actualizada.</div>`
        : "";
      if (!inspections.length) {
        listEl.innerHTML = offlineNotice + `<div class="card p-8 text-center text-sm text-slate-500">No hay inspecciones${currentFilter ? " con este estado" : ""}.</div>`;
        return;
      }
      listEl.innerHTML = offlineNotice + inspections
        .map(
          (i) => `
        <div class="card p-4 flex items-center justify-between gap-3">
          <a href="/inspection.html?id=${i.id}" class="min-w-0 flex-1 block">
            <div class="font-medium text-slate-800 truncate">${escapeHtml(i.building_name || i.form_number || "Inspección sin nombre")}</div>
            <div class="text-xs text-slate-500 mt-0.5 truncate">${escapeHtml(i.address || "—")} ${i.municipality ? "· " + escapeHtml(i.municipality) : ""}${i.department ? ", " + escapeHtml(i.department) : ""} · ${fmtDate(i.updated_at)}</div>
            <div class="flex items-center gap-2 mt-2">${habitabilityBadge(i.habitability)}${statusBadge(i.status)}</div>
          </a>
          <div class="flex flex-col items-end gap-1.5 shrink-0">
            <a href="/inspection.html?id=${i.id}" class="text-xs text-brand-600 hover:underline">${i.status === "BORRADOR" || i.status === "EN_PROCESO" ? "Continuar →" : "Abrir →"}</a>
            <button class="delete-btn text-xs text-red-500 hover:underline" data-id="${i.id}" data-name="${escapeHtml(i.building_name || i.form_number || "esta inspección")}">Eliminar</button>
          </div>
        </div>
      `,
        )
        .join("");

      document.querySelectorAll(".delete-btn").forEach((btn) =>
        btn.addEventListener("click", async () => {
          if (!confirm(`¿Eliminar "${btn.dataset.name}"? Esta acción no se puede deshacer.`)) return;
          await api(`/inspections/${btn.dataset.id}`, { method: "DELETE" });
          window.localInspectionsIndex?.remove(btn.dataset.id);
          load();
        }),
      );
    }

    document.getElementById("newInspectionBtn").addEventListener("click", async () => {
      const id = window.newClientId();
      try {
        await api("/inspections", { method: "POST", body: JSON.stringify({ id }) });
      } catch {}
      window.location.href = `/inspection.html?id=${id}`;
    });

    renderFilters();
    load();
  </script>
</body>
</html>
